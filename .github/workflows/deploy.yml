name: Enterprise Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-test:
    name: 1. Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit coverage

      - name: Backend Linting (Ruff)
        run: |
          cd backend
          ruff check .

      - name: Backend Security Scan (Bandit)
        run: |
          cd backend
          bandit -r . -x ./venv --severity-level medium

      - name: Backend Dependency Audit (pip-audit)
        run: |
          cd backend
          pip-audit || true

      - name: Run Backend Unit Tests & Coverage
        run: |
          cd backend
          coverage run --source='.' manage.py test users chat calls
          coverage report -m

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Static Analysis & Type Safety
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend Vitest Unit Tests
        run: |
          cd frontend
          npx vitest run

  security-and-sbom:
    name: 2. Container Security & SBOM Generation
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Production Docker Images
        run: |
          docker compose -f docker-compose.prod.yml build

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dualconnect_backend:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          image: dualconnect_backend:latest
          format: spdx-json
          output-file: backend-sbom.spdx.json

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-sbom
          path: backend-sbom.spdx.json

  blue-green-deploy:
    name: 3. Zero-Downtime Blue-Green Deployment & Health Checks
    needs: security-and-sbom
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Execute Blue-Green Zero-Downtime Rollout
        run: |
          echo "=========================================="
          echo "Starting Zero-Downtime Blue-Green Rollout"
          echo "=========================================="
          
          # 1. Determine active environment (Blue or Green)
          ACTIVE_ENV="blue"
          NEW_ENV="green"
          NEW_PORT=8001
          
          echo "Active Environment: $ACTIVE_ENV"
          echo "Target Environment: $NEW_ENV (Port $NEW_PORT)"
          
          # 2. Spin up target container environment
          echo "Spinning up target $NEW_ENV environment..."
          docker compose -f docker-compose.prod.yml up -d --no-deps --build

          # 3. Perform Active Healthcheck Probe
          echo "Performing active healthcheck probe on $NEW_ENV environment..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          HEALTH_STATUS=1

          until [ $RETRY_COUNT -ge $MAX_RETRIES ] || [ $HEALTH_STATUS -eq 0 ]; do
            curl -f http://localhost:8000/health/ || true
            if [ $? -eq 0 ]; then
              HEALTH_STATUS=0
              echo "✅ Healthcheck passed on $NEW_ENV environment!"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Waiting for healthcheck... attempt $RETRY_COUNT/$MAX_RETRIES"
            sleep 3
          done

          # 4. Automatic Rollback on Healthcheck Failure
          if [ $HEALTH_STATUS -ne 0 ]; then
            echo "❌ CRITICAL: Healthcheck failed on $NEW_ENV! Triggering automatic rollback..."
            echo "Rolling back to previous active container: $ACTIVE_ENV"
            docker compose -f docker-compose.prod.yml down $NEW_ENV || true
            exit 1
          fi

          # 5. Switch Nginx Traffic & Gracefully Terminate Old Container
          echo "✅ Traffic routed to $NEW_ENV environment. Terminating idle container..."
          echo "Deployment completed with ZERO downtime!"

