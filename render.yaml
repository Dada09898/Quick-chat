version: "1"

services:
  # ---------------------------------------------------------
  # BACKEND WEB SERVICE (Django ASGI via Docker)
  # ---------------------------------------------------------
  - type: web
    name: dualconnect-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: ohio
    plan: starter # Can be changed to 'free' if limits allow
    envVars:
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: dualconnect-db
          property: connectionString
      # Note: Render does not provide free Redis. You must supply an external Redis URL (e.g. Upstash) in the Render Dashboard
      - key: REDIS_URL
        sync: false 
      - key: CELERY_BROKER_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dualconnect-frontend.onrender.com"
      - key: SECRET_KEY
        generateValue: true

  # ---------------------------------------------------------
  # FRONTEND STATIC SITE (Vite React PWA)
  # ---------------------------------------------------------
  - type: web
    name: dualconnect-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    region: ohio
    envVars:
      - key: VITE_API_URL
        value: "https://dualconnect-backend.onrender.com"
    routes:
      # Redirect all unknown routes to index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------
  # BACKGROUND WORKERS (Celery - Paid Render Tier Required)
  # ---------------------------------------------------------
  - type: worker
    name: dualconnect-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "celery -A config worker -l info"
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dualconnect-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false

  - type: worker
    name: dualconnect-celery-beat
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "celery -A config beat -l info"
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dualconnect-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false

databases:
  # ---------------------------------------------------------
  # MANAGED POSTGRESQL DATABASE
  # ---------------------------------------------------------
  - name: dualconnect-db
    databaseName: dualconnect
    user: dualconnect_user
    region: ohio
    plan: free
